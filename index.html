<!doctype html>
<html lang="en">
<head>
  <title>Stepper motor power calculator</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="header">
    <h1>Stepper Motor Power Calculator</h1>
  </div>

  <section class="card">
    <h2>Inputs</h2>
    <div class="grid">
      <label>Voltage (V)
        <input id="Voltage" type="number" step="0.1" min="0" value="24"/>
      </label>

      <label>Amps (A)
        <input id="Amps" type="number" step="0.01" min="0" value="2.5"/>
      </label>

      <label>Resistance (Ω)
        <input id="Resistance" type="number" step="0.01" min="0" value="1.2" />
      </label>

      <label>Inductance (mH)
        <input id="Inductance" type="number" step="0.01" min="0" value="1.5" />
      </label>

      <label>Steps per revolution (number)
        <input id="StepsPerRevolution" type="number" step="1" min="0" value="200" />
      </label>

      <label>Number of teeth on the motor pulley (number)
        <input id="NumberOfTeeth" type="number" step="1" min="0" value="20" />
      </label>

      <label>Distance between teeth on the motor pulley (mm)
        <input id="DistanceBetweenTeeth" type="number" step="0.1" min="0" value="2" />
      </label>

      <label>Maximum RPM you want the charts to show (number)
        <input id="MaxRPM" type="number" step="1" min="0" value="5000" />
      </label>

      <label>System efficiency (Eg: 1 means it's 100% efficient, 0.5 means it's 50% efficient)
        <input id="SystemEfficiency" type="number" step="0.01" min="0" max="1" value="1" />
      </label>
    </div>

    <button id="GenerateChartButton">Generate charts</button>
  </section>

  <section class="card">
    <h2>Charts</h2>

    <h3>Power (W) vs RPM</h3>
    <canvas id="ChartPowerRpm"></canvas>

    <h3>Power (W) vs Speed (mm/s)</h3>
    <canvas id="ChartPowerSpeed"></canvas>
  </section>

  <script src="lib/chart.umd.min.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
